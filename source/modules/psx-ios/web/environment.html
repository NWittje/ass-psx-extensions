<section id="environment-page" class="panel" hidden aria-label="Environment">
<div class="environment-time"><div class="local-clock"><div id="clock-group" class="clock-fields"><input id="local-hour" type="number" min="0" max="23" aria-label="Local hour"><span>:</span><input id="local-minute" type="number" min="0" max="59" aria-label="Local minute"></div><p id="local-date">Waiting for PSX time</p><input id="time-slider" type="range" min="0" max="1439" step="1" aria-label="Local time, minutes since midnight"><p id="utc-clock" class="availability"></p></div><div class="environment-presets"><div class="season-presets button-row"><button data-time="spring">Spring</button><button data-time="summer">Summer</button><button data-time="autumn">Autumn</button><button data-time="winter">Winter</button></div><div class="time-presets button-row"><button data-time="dawn">Dawn</button><button data-time="day">Day</button><button data-time="dusk">Dusk</button><button data-time="night">Night</button></div></div></div>
<div class="environment-heading"><div class="button-row"><button id="target-planet" aria-pressed="true">Planet</button><button id="target-nearest" aria-pressed="false">Nearest airport</button></div><span id="weather-station"></span></div>
<div class="weather-presets button-row"><button data-weather-preset="cavok">CAVOK</button><button data-weather-preset="cat1">CAT I</button><button data-weather-preset="cat2">CAT II</button><button data-weather-preset="cat3a">CAT IIIA</button><button disabled title="Windy preset is not yet defined">Windy</button></div>
<div class="environment-grid"><div class="atmosphere-column"><div class="atmosphere" id="atmosphere"><svg id="atmosphere-svg" viewBox="0 0 720 520" preserveAspectRatio="xMidYMid meet" role="group" aria-label="Atmosphere side view; draggable cloud boundaries and inversion height"></svg>
<div id="upper-top-box" class="cloud-field"><input id="upper-top" type="number" min="100" max="45100" step="1" data-weather="upper_top"><label for="upper-top">Upper top — ft</label></div>
<div id="upper-base-box" class="cloud-field"><input id="upper-base" type="number" min="100" max="45100" step="1" data-weather="upper_base"><label for="upper-base">Upper base — ft</label></div>
<div id="lower-top-box" class="cloud-field"><input id="lower-top" type="number" min="0" max="45000" step="1"><label for="lower-top">Lower top — ft</label></div>
<div id="lower-base-box" class="cloud-field"><input id="lower-base" type="number" min="0" max="45000" step="1"><label for="lower-base">Lower base — ft</label></div>
<label class="check cb-selector"><input id="cb-selector" type="checkbox">Lower cloud layer contains CB</label>
<div id="inversion-box" class="inversion-field"><div class="paired"><input id="inversion-height" type="number" min="500" max="3500" data-weather="inversion_height" aria-label="Inversion height, feet"><input id="inversion-temperature" type="number" min="-50" max="50" data-weather="inversion_temperature" aria-label="Inversion temperature, Celsius"></div><label>Inversion — ft / °C</label><input id="inversion-slider" type="range" min="5" max="35" aria-label="Inversion temperature"><span id="inversion-scale" class="availability"></span></div>
</div><div class="surface-fields"><div class="surface-number"><input id="surface-temperature" type="number" min="-80" max="50" data-weather="surface_temperature"><label for="surface-temperature">Temperature — °C</label><input id="temperature-slider" type="range" min="-80" max="50" aria-label="Surface temperature, Celsius"></div><div class="surface-number"><input id="qnh" type="number" min="914.4" max="1083.6" step="1" data-weather="qnh"><label for="qnh">QNH — hPa</label></div><div id="wind-group"><div class="wind-fields"><input id="wind-first" type="number" min="0" max="360" placeholder="000" aria-label="Wind direction, magnetic"><span>V</span><input id="wind-second" type="number" min="0" max="360" placeholder="—" aria-label="Variable wind second direction, blank for fixed"><input id="wind-speed" type="number" min="0" max="75" aria-label="Wind speed, knots"><span>G</span><input id="wind-gust" type="number" min="0" max="75" aria-label="Gust speed, knots"></div><label>Wind from — magnetic ° / kt</label></div></div></div>
<aside class="environment-aside"><label class="check"><input id="inversion-enabled" type="checkbox">Inversion enabled</label><svg id="wind-rose" viewBox="0 0 360 360" role="group" aria-label="Magnetic north wind compass; 0 to 50 knot strength rings"></svg></aside></div>
<div class="weather-bottom"><div><label for="precipitation">Precipitation</label><select id="precipitation" data-weather="precipitation"><option value="0">None</option><option value="1">Light</option><option value="2">Moderate</option><option value="3">Heavy</option></select></div><div class="visibility-number"><input id="visibility" type="number" min="0" max="40000" data-weather="visibility"><label for="visibility">Visibility — m</label></div><input id="visibility-slider" type="range" min="0" max="40000" aria-label="Visibility, metres"></div>
<p id="environment-notice" class="availability" role="status"></p><p id="environment-result" role="status"></p>
</section>
<dialog id="time-fold-dialog"><h2>Repeated local time</h2><p>Select the UTC offset for this occurrence.</p><div id="time-fold-buttons" class="button-row"></div><button id="time-fold-cancel" class="secondary">Cancel</button></dialog>
